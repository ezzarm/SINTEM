; ─────────────────────────────────────────────────────────────
; Laravel / Railway hardened PHP config
; ─────────────────────────────────────────────────────────────

[PHP]
; ── Expose settings ──
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; ── Security ──
; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,eval,phpinfo
; ── File handling ──
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 5

; Allow only image MIME types (enforced at app level too)
; ── Session security ──
session.cookie_httponly = 1
session.cookie_secure = 0
; FIX: Strict blocks POST form submissions from same-site navigations in some browsers.
; Laravel manages same_site via its own config (SESSION_SAME_SITE=lax). Set php.ini to Lax
; so it does not conflict and kill CSRF token delivery.
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 1440

; ── General limits ──
max_execution_time = 120
max_input_time = 120
memory_limit = 512M
; FIX: 1000 is too low for forms with many fields + CSRF + _method + file uploads.
max_input_vars = 3000

; ── OPcache (performance + security) ──
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
; FIX: validate_timestamps=0 means code changes are NEVER picked up after first cache.
; Must be 1 so deployment changes are reflected. revalidate_freq=60 keeps performance.
opcache.validate_timestamps = 1