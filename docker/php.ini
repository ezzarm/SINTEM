; ─────────────────────────────────────────────────────────────
; Laravel / Railway hardened PHP config
; ─────────────────────────────────────────────────────────────

[PHP]
; ── Expose settings ──
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; ── Security ──
; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,eval,assert,phpinfo

; ── File handling ──
file_uploads = On
upload_max_filesize = 10M
post_max_size = 10M
max_file_uploads = 5

; Allow only image MIME types (enforced at app level too)
; ── Session security ──
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.gc_maxlifetime = 1440

; ── General limits ──
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
max_input_vars = 1000

; ── OPcache (performance + security) ──
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.validate_timestamps = 0