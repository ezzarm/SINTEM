user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # FIX 1: Naikkan dari 25M ke 32M agar file upload tidak dipotong
    # nginx sebelum sampai ke PHP-FPM
    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # FIX 2: Pisah zone untuk upload (longgar) dan API biasa
    limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;

    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        limit_conn addr 20;

        add_header X-Frame-Options "SAMEORIGIN"                                always;
        add_header X-Content-Type-Options "nosniff"                            always;
        add_header X-XSS-Protection "1; mode=block"                           always;
        add_header Referrer-Policy "strict-origin-when-cross-origin"           always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net cdnjs.cloudflare.com cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.jsdelivr.net cdnjs.cloudflare.com cdn.tailwindcss.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' cdn.tailwindcss.com; frame-ancestors 'none';"
            always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(env|log|sql|bak|config|ini|sh|bat|swp|git)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ^/(storage/framework|bootstrap/cache|vendor|config|database|app|tests) {
            deny all;
        }

        location = /login {
            limit_req zone=login burst=3 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Upload routes — pakai zone upload yg lebih longgar, bukan zone api
        location ~* ^/(laporan/buat|temuan/buat|admin/pengumuman|admin/temuan|admin/kalender|profile) {
            limit_req zone=upload burst=20;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # FIX 3: PHP-FPM dengan konfigurasi lengkap
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_param HTTPS                    on;
            fastcgi_param HTTP_X_FORWARDED_PROTO   https;
            fastcgi_param HTTP_X_FORWARDED_FOR     $proxy_add_x_forwarded_for;

            # FIX 5: Timeout lebih panjang untuk proses upload file
            fastcgi_read_timeout 300;

            # FIX 6: Buffer lebih besar agar response tidak terpotong
            fastcgi_buffers 32 32k;
            fastcgi_buffer_size 64k;

            # FIX 7: Naikkan burst dari 60 ke 120 agar resubmit form
            # setelah validasi gagal tidak langsung kena 500
            limit_req zone=api burst=120 nodelay;
        }

        location ~* ^/storage/.*\.php$ {
            deny all;
        }
    }
}
