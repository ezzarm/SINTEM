user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Hide version from attackers ──
    server_tokens off;

    # ── Logging ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # FIX: Naikkan dari 25M ke 32M agar request upload tidak dipotong nginx
    # sebelum sampai ke PHP (terutama untuk konversi Base64 internal)
    client_max_body_size 32M;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Rate limiting zones ──
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=120r/m;

    # FIX: Zone khusus untuk upload — lebih longgar, tidak ada burst agresif
    limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;

    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # ── Connection limits ──
        limit_conn addr 20;

        # ── Security headers ──
        add_header X-Frame-Options "SAMEORIGIN"                                always;
        add_header X-Content-Type-Options "nosniff"                            always;
        add_header X-XSS-Protection "1; mode=block"                           always;
        add_header Referrer-Policy "strict-origin-when-cross-origin"           always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net cdnjs.cloudflare.com cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.jsdelivr.net cdnjs.cloudflare.com cdn.tailwindcss.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' cdn.tailwindcss.com; frame-ancestors 'none';"
            always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Block access to hidden files ──
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Block access to sensitive file extensions ──
        location ~* \.(env|log|sql|bak|config|ini|sh|bat|swp|git)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Block access to Laravel internal directories ──
        location ~ ^/(storage/framework|bootstrap/cache|vendor|config|database|app|tests) {
            deny all;
        }

        # ── Rate-limit login endpoint ──
        location = /login {
            limit_req zone=login burst=3 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── Static assets (long cache) ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ── Main Laravel handler ──
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # FIX: Endpoint upload dipisah dari PHP umum agar tidak kena rate limit ketat
        # Mencakup semua route yang ada form upload foto di aplikasi SINTEM
        location ~* ^/index\.php$ {
            # Cek apakah ini request upload (multipart/form-data)
            # Gunakan zone upload yang lebih longgar
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_param HTTPS                    on;
            fastcgi_param HTTP_X_FORWARDED_PROTO   https;
            fastcgi_param HTTP_X_FORWARDED_FOR     $proxy_add_x_forwarded_for;

            fastcgi_param PHP_VALUE "upload_max_filesize=20M \n post_max_size=32M \n memory_limit=512M";

            # FIX: Naikkan timeout untuk request yang membawa file besar
            fastcgi_read_timeout 600;

            # FIX: Naikkan buffer agar response besar tidak error
            fastcgi_buffers 32 32k;
            fastcgi_buffer_size 64k;

            # FIX: Gunakan zone upload (lebih longgar) dengan burst tinggi
            # nodelay dihapus agar tidak langsung reject saat burst
            limit_req zone=upload burst=30;
        }

        # ── PHP-FPM (fallback untuk .php lainnya) ──
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_param HTTPS                    on;
            fastcgi_param HTTP_X_FORWARDED_PROTO   https;
            fastcgi_param HTTP_X_FORWARDED_FOR     $proxy_add_x_forwarded_for;

            fastcgi_param PHP_VALUE "upload_max_filesize=20M \n post_max_size=32M \n memory_limit=512M";
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # FIX: Naikkan burst dari 60 ke 120 agar resubmit form tidak langsung 500
            limit_req zone=api burst=120 nodelay;
        }

        # ── Block PHP execution in upload directories ──
        location ~* ^/storage/.*\.php$ {
            deny all;
        }
    }
}
